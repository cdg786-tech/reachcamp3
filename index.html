<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMP3 | Fractional Revenue Operations &amp; Process Innovation</title>
  <meta name="description" content="CAMP3: fractional revenue operations and process innovation for architecture and design practices.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23141414'/%3E%3Crect x='8' y='8' width='4' height='16' fill='%23DC2626'/%3E%3Crect x='14' y='8' width='4' height='16' fill='%232B4C9B'/%3E%3Crect x='20' y='8' width='4' height='16' fill='%23E8B817'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0E0E0E;
      --panel: #161616;
      --line: rgba(255,255,255,0.08);
      --text: #FFFFFF;
      --muted: rgba(255,255,255,0.55);
      --dim: rgba(255,255,255,0.3);
      --red: #DC2626;
      --blue: #2B4C9B;
      --gold: #E8B817;
    }

    html, body { background: var(--bg); }
    body {
      font-family: 'Instrument Sans', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.25rem; width: 100%; }

    /* NAV */
    nav { border-bottom: 1px solid var(--line); }
    nav .container { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo { font-weight: 700; font-size: 1.5rem; color: var(--text); letter-spacing: 0.08em; text-decoration: none; display: inline-flex; align-items: center; }
    .tri { display: inline-flex; gap: 4px; margin-left: 8px; }
    .tri i { display: inline-block; width: 4px; height: 16px; border-radius: 1px; }
    .tri i:nth-child(1) { background: var(--red); }
    .tri i:nth-child(2) { background: var(--blue); }
    .tri i:nth-child(3) { background: var(--gold); }
    .nav-cta { border: 1px solid rgba(255,255,255,0.25); color: var(--text); padding: 0.45rem 1rem; border-radius: 4px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.06em; text-decoration: none; transition: all 0.2s; }
    .nav-cta:hover { background: var(--text); color: var(--bg); }

    /* MAIN */
    main { flex: 1; display: flex; align-items: center; padding: clamp(3rem, 8vw, 5rem) 0; }
    .label { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 1rem; }
    h1 { font-size: clamp(2.1rem, 5.5vw, 3.6rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 2.5rem; }
    h1 span { color: var(--muted); font-weight: 500; }

    .cards { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .card { background: var(--panel); padding: 1.5rem 1.5rem 1.6rem; position: relative; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .card:nth-child(1)::before { background: var(--red); }
    .card:nth-child(2)::before { background: var(--blue); }
    .card-num { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--dim); letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
    .card p { font-size: 0.93rem; color: var(--muted); }

    /* FOOTER */
    footer { position: relative; overflow: hidden; }
    .stripe { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 4px; }
    .stripe i:nth-child(1) { background: var(--red); }
    .stripe i:nth-child(2) { background: var(--blue); }
    .stripe i:nth-child(3) { background: var(--gold); }
    .foot { display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; align-items: center; justify-content: space-between; padding: 1.5rem 1.25rem; font-family: 'DM Mono', monospace; font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

    @media (min-width: 720px) {
      .cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <a href="#" class="logo">CAMP3 <span class="tri"><i></i><i></i><i></i></span></a>
      <a href="mailto:chris@reachcamp3.com" class="nav-cta">GET IN TOUCH</a>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="label">Architecture &amp; Design Practices</div>
      <h1>Fractional Revenue Operations<br><span>&amp; Process Innovation.</span></h1>
      <div class="cards">
        <div class="card">
          <div class="card-num">01</div>
          <h2>Revenue Operations</h2>
          <p>Pricing, pipeline, pursuit and reporting.</p>
        </div>
        <div class="card">
          <div class="card-num">02</div>
          <h2>Process Innovation</h2>
          <p>Workflows, tools and automation.</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="stripe"><i></i><i></i><i></i></div>
    <div class="container foot">
      <span>&copy; 2026 CAMP3</span>
      <span>Revenue Operations · Process Innovation</span>
    </div>
  </footer>

</body>
</html>
